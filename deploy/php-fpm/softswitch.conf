; Rendered by install.sh to /etc/php-fpm.d/softswitch.conf
[softswitch]
user = @SS_APP_USER@
group = @SS_APP_USER@
listen = /run/php-fpm/softswitch.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[error_log] = /var/log/php-fpm/softswitch-error.log
php_admin_flag[log_errors] = on
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 256M
; Laravel manages its own sessions (database driver), so PHP's are unused.
