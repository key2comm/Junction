# Rendered by install.sh to /etc/systemd/system/php-fpm.service.d/softswitch.conf
# Sandbox for PHP-FPM, which runs the web app. The web app never uses sudo, so
# it gets the strict set: everything read-only except what it writes.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_KILL
UMask=0027
ProtectSystem=strict
ReadWritePaths=/run/php-fpm /var/log/php-fpm -/var/lib/php @SS_WEB_ROOT@/storage -/var/lib/softswitch
ReadWritePaths=-@SS_FS_CONF@/sip_profiles/carrier -@SS_FS_CONF@/directory/pbx -@SS_FS_CONF@/acl -@SS_FS_GREETINGS@
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
