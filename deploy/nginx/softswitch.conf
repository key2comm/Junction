# Rendered by install.sh to /etc/nginx/conf.d/softswitch.conf

# WebRTC phones: FreeSWITCH sees them as 127.0.0.1, so fail2ban can't ban
# password guessers; limit new WebSocket connections per client here instead.
limit_req_zone $binary_remote_addr zone=softswitch_ws:10m rate=10r/m;

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name softswitch; # default_server catches every hostname

	# Let's Encrypt HTTP-01 challenges (issued from the admin UI).
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/acme;
		default_type text/plain;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	http2 on;
	server_name softswitch; # default_server catches every hostname

	# Symlinks managed by softswitch-cert (self-signed or Let's Encrypt).
	ssl_certificate     /etc/softswitch/tls/current.crt;
	ssl_certificate_key /etc/softswitch/tls/current.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:softswitch:10m;

	root @SS_WEB_ROOT@/public;
	index index.php;
	charset utf-8;
	client_max_body_size 64m; # rate deck uploads

	add_header X-Frame-Options SAMEORIGIN always;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	# FreeSWITCH callbacks are only served on the loopback server below.
	location ^~ /internal/ { return 404; }

	# SIP over WebSocket for WebRTC phones -> FreeSWITCH internal profile (loopback).
	location = /ws {
		limit_req zone=softswitch_ws burst=10 nodelay;
		proxy_pass https://127.0.0.1:@SS_PBX_WSS_PORT@;
		proxy_ssl_verify off; # loopback to FreeSWITCH's self-signed wss.pem
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }

	location ~ ^/index\.php(/|$) {
		fastcgi_pass unix:/run/php-fpm/softswitch.sock;
		fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
		include fastcgi_params;
		fastcgi_hide_header X-Powered-By;
		fastcgi_read_timeout 120s;
		# Vite's Link preload header plus session cookies exceed the 4k default.
		fastcgi_buffer_size 32k;
		fastcgi_buffers 16 16k;
	}

	location ~ \.php$ { return 404; }
	location ~ /\.(?!well-known).* { deny all; }
}

# Loopback-only server for FreeSWITCH -> app callbacks (CDRs). Port 8008 is an
# http_port_t port in SELinux, so nginx may bind it without policy changes.
server {
	listen 127.0.0.1:8008;
	server_name softswitch-internal;
	root @SS_WEB_ROOT@/public;
	client_max_body_size 4m;
	access_log off;

	location ^~ /internal/ {
		fastcgi_pass unix:/run/php-fpm/softswitch.sock;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
		fastcgi_param SCRIPT_NAME /index.php;
		fastcgi_read_timeout 30s;
	}

	location / { return 404; }
}
